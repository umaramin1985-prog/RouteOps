services:
  backend:
    build:
      context: ./backend
    environment:
    - WATCHFILES_FORCE_POLLING=true
    ports:
    - 8000:8000
    volumes:
    - ./backend:/app
    - ./data:/data
    - /var/run/docker.sock:/var/run/docker.sock
  db:
    environment:
      POSTGRES_DB: osrm_portal
      POSTGRES_PASSWORD: password123
      POSTGRES_USER: admin
    image: postgis/postgis:15-3.3
    ports:
    - 5433:5432
    volumes:
    - db_data:/var/lib/postgresql/data
  frontend:
    build:
      context: ./frontend
    environment:
    - CHOKIDAR_USEPOLLING=true
    ports:
    - 5173:5173
    volumes:
    - ./frontend:/app
    - /app/node_modules
  osrm-car:
    command: osrm-routed --algorithm mld /data/car.osrm
    image: osrm/osrm-backend
    ports:
    - 5002:5000
    volumes:
    - ./data:/data
  osrm-foot:
    command: osrm-routed --algorithm mld /data/foot.osrm
    image: osrm/osrm-backend
    ports:
    - 5003:5000
    volumes:
    - ./data:/data
version: '3.8'
volumes:
  db_data: null
