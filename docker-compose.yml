name: routeops

services:
  backend:
    build:
      context: ./backend
    environment:
      - WATCHFILES_FORCE_POLLING=true
      - PROCFS_PATH=/host_proc
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host_proc:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # Fallback route from backend to OSRM host ports (maxspeed proxy)
  db:
    environment:
      POSTGRES_DB: osrm_portal
      POSTGRES_PASSWORD: password123
      POSTGRES_USER: admin
    image: postgis/postgis:15-3.3
    ports:
      - 5433:5432
    volumes:
      - db_data:/var/lib/postgresql/data
  frontend:
    build:
      context: ./frontend
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
