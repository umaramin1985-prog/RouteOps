name: routeops

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PROCFS_PATH=/host_proc
    ports:
      - "5172:8000"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock # Need this to restart OSRM containers from backend
      - /proc:/host_proc:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # Fallback route from backend to OSRM host ports (maxspeed proxy)
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    restart: always

  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: osrm_portal
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

volumes:
  db_data:
